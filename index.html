<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b43"><link rel="manifest" href="manifest.json"><title>Laura's Portuguese</title><style>
:root{--g:#176b43;--bg:#f3f7f4;--card:#fff;--text:#162018}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}main{max-width:520px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:end}h1{font-size:26px;margin:3px 0}small,.muted{color:#65736a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat,.card{background:var(--card);border:1px solid #dbe7df;border-radius:18px;padding:13px;text-align:center}.card{min-height:330px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px #164d2d16}#word{font-size:38px;font-weight:750;margin:12px}#answer{font-size:22px;font-weight:650;background:#edf7f0;border-radius:14px;padding:14px;margin:8px}button,select{font:inherit}button{border:0;border-radius:13px;padding:12px;cursor:pointer}.primary{background:var(--g);color:#fff;font-weight:700}.listen{background:#e7f3eb;color:#0b5a34;font-weight:700}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.hard{background:#fde8e8;color:#8b1d1d}.learn{background:#fff1cf;color:#754d00}.easy{background:#e5f6ea;color:#126035}select{width:100%;padding:11px;border-radius:12px;border:1px solid #cbd8cf;background:var(--card);color:inherit;margin:10px 0}.hide{display:none}#msg{min-height:22px;text-align:center;margin-top:10px;color:#176b43}@media(prefers-color-scheme:dark){:root{--bg:#101813;--card:#18231b;--text:#edf5ef}#answer{background:#233429}select{border-color:#395043}}</style></head><body><main><header><div><small>LAURA'S PORTUGUESE 🇵🇹</small><h1>Today's practice</h1></div><b id="saved">✓ saved</b></header><div class="stats"><div class="stat"><b id="due">0</b><br><small>Due</small></div><div class="stat"><b id="learning">0</b><br><small>Learning</small></div><div class="stat"><b id="learned">0</b><br><small>Learned</small></div></div><select id="cat"><option>All categories</option></select><section class="card"><small id="meta">New word</small><div id="word"></div><button class="listen" id="speak">🔊 European Portuguese</button><button id="reveal">Reveal meaning</button><div id="answer" class="hide"></div></section><div class="ratings"><button class="hard rate" data-r="hard">😵 Hard<br><small>10 min</small></button><button class="learn rate" data-r="learn">🤔 Learning<br><small>1 day</small></button><button class="easy rate" data-r="easy">😊 Easy<br><small id="ei">3 days</small></button></div><p id="msg" aria-live="polite"></p><p class="muted" style="text-align:center;font-size:12px">Progress stays on this device. Vocabulary adapted from your “1000 Palavras Portuguesas Mais Comuns” guide.</p></main><script>
const W=[["olá / oi", "hello / hi", "Basics"], ["tudo bem?", "how are you? / how’s it going?", "Basics"], ["bom dia", "good morning / good day", "Basics"], ["boa tarde", "good afternoon", "Basics"], ["boa noite", "good evening / good night", "Basics"], ["adeus", "goodbye", "Basics"], ["até à próxima", "see you next time", "Basics"], ["obrigada", "thank you (if you’re a woman)", "Basics"], ["de nada", "you’re welcome", "Basics"], ["com licença", "excuse me", "Basics"], ["desculpe", "I’m sorry (formal)", "Basics"], ["não percebi", "I didn’t understand", "Basics"], ["sim", "yes", "Basics"], ["não", "no", "Basics"], ["talvez", "maybe", "Basics"], ["o tempo", "the time", "Time"], ["o momento", "the moment", "Time"], ["o ano", "the year", "Time"], ["o mês", "the month", "Time"], ["a semana", "the week", "Time"], ["o dia", "the day", "Time"], ["a hora", "the hour", "Time"], ["a manhã", "the morning", "Time"], ["a tarde", "the afternoon", "Time"], ["a noite", "the night", "Time"], ["ontem", "yesterday", "Time"], ["hoje", "today", "Time"], ["amanhã", "tomorrow", "Time"], ["a família", "the family", "Family"], ["o pai", "the father", "Family"], ["a mãe", "the mother", "Family"], ["o filho", "the son", "Family"], ["a filha", "the daughter", "Family"], ["o irmão", "the brother", "Family"], ["a irmã", "the sister", "Family"], ["o casamento", "the wedding / marriage", "Family"], ["a comida", "the food", "Food"], ["a água", "the water", "Food"], ["o vinho", "the wine", "Food"], ["o café", "the coffee", "Food"], ["o pão", "the bread", "Food"], ["o queijo", "the cheese", "Food"], ["o ovo", "the egg", "Food"], ["a casa", "the house / home", "Home"], ["o quarto", "the bedroom", "Home"], ["a cozinha", "the kitchen", "Home"], ["a casa de banho", "the bathroom", "Home"], ["a mesa", "the table", "Home"], ["a cadeira", "the chair", "Home"], ["a cama", "the bed", "Home"], ["ser", "to be (permanent)", "Verbs"], ["ter", "to have", "Verbs"], ["estar", "to be (temporary)", "Verbs"], ["poder", "to be able to / can", "Verbs"], ["querer", "to want", "Verbs"], ["fazer", "to do / make", "Verbs"], ["ir", "to go", "Verbs"], ["vir", "to come", "Verbs"], ["falar", "to speak", "Verbs"], ["saber", "to know something", "Verbs"], ["aprender", "to learn", "Verbs"], ["trabalhar", "to work", "Verbs"], ["ler", "to read", "Verbs"], ["escrever", "to write", "Verbs"]].map((x,i)=>({id:i,pt:x[0],en:x[1],cat:x[2]}));const KEY='laura_pt_srs_v3',DAY=864e5;let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){};let cur=null;const $=s=>document.querySelector(s),P=id=>S[id]||(S[id]={due:0,interval:0,reps:0,status:'new'});[...new Set(W.map(w=>w.cat))].forEach(c=>$('#cat').add(new Option(c,c)));function pool(){let a=W.filter(w=>$('#cat').value==='All categories'||w.cat===$('#cat').value),n=Date.now();let d=a.filter(w=>P(w.id).due<=n);return (d.length?d:a).sort((x,y)=>P(x.id).due-P(y.id).due)}function stats(){let n=Date.now(),a=W.filter(w=>$('#cat').value==='All categories'||w.cat===$('#cat').value);$('#due').textContent=a.filter(w=>P(w.id).due<=n).length;$('#learning').textContent=a.filter(w=>P(w.id).status==='learning').length;$('#learned').textContent=a.filter(w=>P(w.id).status==='learned').length}function show(){cur=pool()[0];let p=P(cur.id);$('#word').textContent=cur.pt;$('#answer').textContent=cur.en;$('#answer').classList.add('hide');$('#meta').textContent=p.reps?`Reviewed ${p.reps} times · ${cur.cat}`:`New · ${cur.cat}`;$('#ei').textContent=(p.interval<3?3:Math.min(60,Math.round(p.interval*2.2)))+' days';stats()}function save(){localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='✓ saved'}function rate(r){let p=P(cur.id),n=Date.now();p.reps++;if(r==='hard'){p.interval=0;p.due=n+600000;p.status='learning';$('#msg').textContent='Back in about 10 minutes.'}else if(r==='learn'){p.interval=1;p.due=n+DAY;p.status='learning';$('#msg').textContent='Scheduled for tomorrow.'}else{p.interval=p.interval<3?3:Math.min(60,Math.round(p.interval*2.2));p.due=n+p.interval*DAY;p.status=p.interval>=7?'learned':'learning';$('#msg').textContent=`Great. Next review in ${p.interval} days.`}save();show()}$('#reveal').onclick=()=>$('#answer').classList.toggle('hide');$('.ratings').onclick=e=>{let b=e.target.closest('.rate');if(b)rate(b.dataset.r)};$('#cat').onchange=show;$('#speak').onclick=()=>{if(!('speechSynthesis'in window))return $('#msg').textContent='Speech is unavailable in this browser.';speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.pt.split('/')[0].trim());u.lang='pt-PT';u.rate=.82;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang.toLowerCase()==='pt-pt')||v.find(x=>x.lang.toLowerCase().startsWith('pt'))||null;speechSynthesis.speak(u)};show();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
